# Standalone-VM example only. The public host-port mapping below must not be
# used on the shared Agent Outpost VM; see docs/agent-outpost-deployment.md.
services:
  collected-recipes:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: collected-recipes
    env_file:
      - .env.azure
    environment:
      NODE_ENV: production
      PORT: "3000"
      RECIPE_DATABASE_PATH: /data/recipes.db
    ports:
      # Requires standalone-VM network restrictions. Never copy this public
      # mapping to Agent Outpost, where the app must be loopback-only.
      - "80:3000"
    volumes:
      - type: bind
        source: /mnt/recipes
        target: /data
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
