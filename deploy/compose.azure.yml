services:
  collected-recipes:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: collected-recipes
    env_file:
      - .env.azure
    environment:
      NODE_ENV: production
      PORT: "3000"
      RECIPE_DATABASE_PATH: /data/recipes.db
    ports:
      - "80:3000"
    volumes:
      - type: bind
        source: /mnt/recipes
        target: /data
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
